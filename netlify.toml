[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "18"

# Clean URLs - serve about.html as /about
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Directory index files
[[redirects]]
  from = "/cases"
  to = "/cases/index.html"
  status = 200

[[redirects]]
  from = "/oral-histories"
  to = "/oral-histories/index.html"
  status = 200

[[redirects]]
  from = "/archive"
  to = "/archive/index.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo/index.html"
  status = 200

# GitHub Pages compatibility - serve .html files without extension
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Fallback to index.html for directories
[[redirects]]
  from = "/*/"
  to = "/:splat/index.html"
  status = 200

[context.production]
  environment = { NODE_VERSION = "18" }

[context.deploy-preview]
  environment = { NODE_VERSION = "18" }

[context.branch-deploy]
  environment = { NODE_VERSION = "18" }
